<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: só carrega recursos do próprio app e só abre conexões com o
         servidor de sinalização (o Vite troca %...% pelo valor do .env). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' %RENDERER_VITE_SERVIDOR_URL%"
    />
    <title>Acesso Remoto</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="inicio">
      <section class="cartao" aria-labelledby="titulo-este">
        <h2 id="titulo-este">Este computador</h2>
        <p class="rotulo">Seu ID</p>
        <div class="linha-id">
          <output id="meu-id" class="id" aria-live="polite">— — —</output>
          <button id="copiar-id" type="button" class="secundario" disabled>Copiar</button>
        </div>
        <p id="status-conexao" class="status" data-fase="conectando">Conectando ao servidor…</p>
      </section>

      <section class="cartao" aria-labelledby="titulo-outro">
        <h2 id="titulo-outro">Acessar outro computador</h2>
        <form id="form-conectar" novalidate>
          <label class="rotulo" for="id-remoto">ID do outro computador</label>
          <div class="linha-id">
            <input
              id="id-remoto"
              class="id"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              placeholder="000 000 000"
            />
            <button id="botao-conectar" type="submit" disabled>Conectar</button>
          </div>
          <p id="aviso-conectar" class="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer id="rodape" class="rodape"></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
